<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000"><title>Crépouille — Compteur de crêpes</title><style>html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{display:flex;align-items:flex-start;justify-content:center}main{text-align:center;width:100%;max-width:720px;padding:28px 20px 50px;box-sizing:border-box}h1{font-size:18px;letter-spacing:2px;color:#888;margin-top:8px}#version{font-size:12px;color:#555}#count{font-size:clamp(90px,28vw,180px);font-weight:700;line-height:1;margin:26px 0 14px}#label{font-size:18px;color:#bbb}#status{font-size:18px;color:#aaa;margin:14px}#diag{font-size:13px;color:#777;line-height:1.5;min-height:38px}#heard{font-size:14px;color:#888;min-height:20px;margin:8px 0 14px}button{border:1px solid #555;border-radius:16px;background:#181818;color:#fff;padding:14px 18px;font-size:18px;margin:5px}#listen{background:#176b35;border:0;font-size:19px;padding:17px 28px}.card{margin:28px auto 0;background:#0f0f0f;border:1px solid #222;border-radius:20px;padding:18px;text-align:left}.card h2{font-size:17px;margin:0 0 14px;color:#aaa;text-align:center}.person{display:flex;justify-content:space-between;padding:12px 6px;border-top:1px solid #222}.person span{font-size:24px}.admin input{width:58%;max-width:280px;padding:13px 14px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:16px}small{display:block;color:#666;margin:18px auto;line-height:1.5}</style></head><body><main><h1>CRÉPOUILLE</h1><div id="version">Version 2.6</div><div id="count">0</div><div id="label">crêpes au total</div><div id="status">Prêt</div><div id="diag">Diagnostic : en attente</div><div id="heard"></div><button onclick="manualChange(-1)">−</button><button onclick="manualZero()">0</button><button onclick="manualChange(1)">+</button><br><button id="listen" onclick="toggle()">Démarrer l’écoute</button><small>Exemple : « Crapouille Mathieu +1 » ou « Crépouille Nathalie moins un »</small><div class="card"><h2>Compteurs individuels</h2><div id="people"></div></div><div class="card admin"><h2>Ajouter un prénom</h2><input id="newName" placeholder="Ex. Mathieu"><button onclick="addPerson()">Ajouter</button></div></main><script>const DEFAULT_PEOPLE=["Mathieu","Sébastien","Cyrille","Emilie","Nathalie","Camille"];let data=JSON.parse(localStorage.getItem("crepouilleData")||"null")||{total:0,people:{}};if(!data.people||typeof data.people!=="object")data.people={};DEFAULT_PEOPLE.forEach(n=>{if(!(n in data.people))data.people[n]=0});delete data.people.Delphine;let listening=false,recognition=null,lastKey="",lastTime=0;const $=id=>document.getElementById(id);function save(){localStorage.setItem("crepouilleData",JSON.stringify(data))}function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/−/g,"-").replace(/\s+/g," ").trim()}function render(){$("count").textContent=data.total;const h=$("people");h.innerHTML="";Object.entries(data.people).sort((a,b)=>a[0].localeCompare(b[0],"fr")).forEach(([n,v])=>{const r=document.createElement("div");r.className="person";r.innerHTML=`<strong>${n}</strong><span>${v}</span>`;h.appendChild(r)});save()}function setStatus(t){$("status").textContent=t}function diag(t){$("diag").textContent="Diagnostic : "+t}function apply(name,d){data.people[name]+=d;data.total+=d;render();setStatus(`${name} ${d>0?"+1":"−1"}`)}function manualChange(n){data.total+=n;render()}function manualZero(){data.total=0;Object.keys(data.people).forEach(k=>data.people[k]=0);render()}function addPerson(){const i=$("newName"),n=i.value.trim();if(!n)return;if(!(n in data.people))data.people[n]=0;i.value="";render()}function detectPerson(t){for(const n of Object.keys(data.people)){if((" "+norm(t)+" ").includes(" "+norm(n)+" "))return n}return null}function hasWake(t){t=norm(t).replace(/ /g,"");return /cr[ae]pouille?s?/.test(t)||t.includes("crepouille")||t.includes("crapouille")}function parse(text){const t=norm(text),p=detectPerson(t);if(!p||!hasWake(t))return null;let d=null;if(/(^|\s)(\+1|plus un|ajoute un|incremente)(\s|$)/.test(t))d=1;else if(/(^|\s)(-1|moins un|enleve un|retire un|decremente)(\s|$)/.test(t))d=-1;return d?{p,d}:null}function handle(text){$("heard").textContent="Entendu : « "+text+" »";const x=parse(text);if(!x)return;const k=x.p+":"+x.d,now=Date.now();if(k===lastKey&&now-lastTime<1400)return;lastKey=k;lastTime=now;apply(x.p,x.d)}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function setup(){if(!SR){diag("API SpeechRecognition absente");setStatus("Reconnaissance vocale non disponible");return false}recognition=new SR();recognition.lang="fr-FR";recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=3;recognition.onstart=()=>diag("reconnaissance démarrée");recognition.onaudiostart=()=>diag("micro actif");recognition.onsoundstart=()=>diag("son détecté");recognition.onspeechstart=()=>diag("parole détectée");recognition.onspeechend=()=>diag("fin de parole");recognition.onresult=e=>{diag("résultat reçu");for(let i=e.resultIndex;i<e.results.length;i++)for(let a=0;a<e.results[i].length;a++)handle(e.results[i][a].transcript)};recognition.onerror=e=>{diag("erreur : "+e.error);if(e.message)$("heard").textContent=e.message};recognition.onend=()=>{diag("reconnaissance arrêtée");if(listening)setTimeout(()=>{try{recognition.start()}catch(e){diag("relance impossible : "+e.message)}},800)};return true}function toggle(){if(listening){listening=false;try{recognition.stop()}catch(e){}$("listen").textContent="Démarrer l’écoute";setStatus("Pause");diag("arrêt demandé");return}if(!setup())return;listening=true;try{recognition.start();$("listen").textContent="Mettre en pause";setStatus("Écoute active");diag("démarrage demandé")}catch(e){listening=false;diag("erreur démarrage : "+e.message)}}render();</script></body></html>
