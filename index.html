<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000"><title>Crépouille</title><style>html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{text-align:center;max-width:720px;margin:auto;padding:28px 20px 50px;box-sizing:border-box}h1{font-size:18px;letter-spacing:2px;color:#888}#version{font-size:12px;color:#555}#count{font-size:clamp(90px,28vw,180px);font-weight:700;margin:24px 0 10px}#status{font-size:20px;margin:14px}#mode{font-size:16px;color:#aaa;min-height:24px}#heard,#diag{font-size:13px;color:#777;min-height:20px;margin-top:8px}button{border:1px solid #555;border-radius:16px;background:#181818;color:#fff;padding:14px 18px;font-size:18px;margin:5px}#listen{background:#176b35;border:0}.card{margin-top:28px;background:#0f0f0f;border:1px solid #222;border-radius:20px;padding:18px;text-align:left}.card h2{text-align:center;font-size:17px;color:#aaa}.person{display:flex;justify-content:space-between;padding:12px 6px;border-top:1px solid #222}.person span{font-size:24px}.admin input{width:58%;padding:13px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:16px}small{display:block;color:#666;line-height:1.5;margin:18px auto}</style></head><body><main><h1>CRÉPOUILLE</h1><div id="version">Version 3.0</div><div id="count">0</div><div>crêpes au total</div><div id="status">Prêt</div><div id="mode">Dites « Crépouille »</div><div id="diag">Diagnostic : en attente</div><div id="heard"></div><button onclick="manualChange(-1)">−</button><button onclick="manualZero()">0</button><button onclick="manualChange(1)">+</button><br><button id="listen" onclick="toggle()">Démarrer l’écoute</button><small>Fonctionnement en deux temps :<br>1. Dites « Crépouille » → bip<br>2. Puis dites « Mathieu plus un » ou « Nathalie moins un »</small><div class="card"><h2>Compteurs individuels</h2><div id="people"></div></div><div class="card admin"><h2>Ajouter un prénom</h2><input id="newName" placeholder="Ex. Mathieu"><button onclick="addPerson()">Ajouter</button></div></main><script>
const DEFAULT_PEOPLE=["Mathieu","Sébastien","Cyrille","Emilie","Nathalie","Camille"];
let data=JSON.parse(localStorage.getItem("crepouilleData")||"null")||{total:0,people:{}};if(!data.people||typeof data.people!=="object")data.people={};DEFAULT_PEOPLE.forEach(n=>{if(!(n in data.people))data.people[n]=0});delete data.people.Delphine;
let listening=false,recognition=null,armed=false,armedUntil=0,lastKey="",lastTime=0,commandFragments=[];const COMMAND_WINDOW=4500;const $=id=>document.getElementById(id);
function save(){localStorage.setItem("crepouilleData",JSON.stringify(data))}function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/−/g,"-").replace(/\s+/g," ").trim()}function render(){$("count").textContent=data.total;const h=$("people");h.innerHTML="";Object.entries(data.people).sort((a,b)=>a[0].localeCompare(b[0],"fr")).forEach(([n,v])=>{const r=document.createElement("div");r.className="person";r.innerHTML=`<strong>${n}</strong><span>${v}</span>`;h.appendChild(r)});save()}function setStatus(t){$("status").textContent=t}function setMode(t){$("mode").textContent=t}function diag(t){$("diag").textContent="Diagnostic : "+t}function beep(freq=700,dur=.09){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}catch(e){}}function apply(name,d){data.people[name]+=d;data.total+=d;render();setStatus(`${name} ${d>0?"+1":"−1"}`);beep(d>0?900:500);disarm()}function manualChange(n){data.total+=n;render()}function manualZero(){data.total=0;Object.keys(data.people).forEach(k=>data.people[k]=0);render()}function addPerson(){const i=$("newName"),n=i.value.trim();if(!n)return;if(!(n in data.people))data.people[n]=0;i.value="";render()}function detectPerson(t){const nt=" "+norm(t)+" ";for(const n of Object.keys(data.people)){if(nt.includes(" "+norm(n)+" "))return n}return null}
function hasWake(t){const x=norm(t).replace(/ /g,"");return /cr[ae]pouill/.test(x)||x.includes("crepouille")||x.includes("crapouille")||x.includes("crepouil")||x.includes("crapouil")}
function parseCommand(t){t=norm(t);const p=detectPerson(t);if(!p)return null;let d=null;if(/(^|\s)(\+\s*1|plus\s+(un|1)|ajoute\s+(un|1)|incremente)(\s|$)/.test(t))d=1;else if(/(^|\s)(-\s*1|moins\s+(un|1)|enleve\s+(un|1)|retire\s+(un|1)|decremente)(\s|$)/.test(t))d=-1;return d?{p,d}:null}
function arm(){armed=true;armedUntil=Date.now()+COMMAND_WINDOW;commandFragments=[];setStatus("Crépouille détecté");setMode("🎙️ Dites maintenant : prénom + plus/moins un");beep(760,.12);setTimeout(()=>{if(armed&&Date.now()>=armedUntil)disarm("Délai expiré — dites « Crépouille »")},COMMAND_WINDOW+100)}function disarm(message){armed=false;commandFragments=[];setMode(message||"Dites « Crépouille »")}
function tryCommand(text){if(!armed||Date.now()>armedUntil){if(armed)disarm();return false}commandFragments.push(text.trim());commandFragments=commandFragments.slice(-3);const candidates=[text,commandFragments.join(" ")];for(const c of candidates){const x=parseCommand(c);if(x){const k=x.p+":"+x.d,now=Date.now();if(k===lastKey&&now-lastTime<1600)return true;lastKey=k;lastTime=now;apply(x.p,x.d);return true}}return false}
function handle(text){$("heard").textContent="Entendu : « "+text+" »";if(armed){tryCommand(text);return}if(hasWake(text))arm()}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function setup(){if(!SR){diag("API SpeechRecognition absente");return false}recognition=new SR();recognition.lang="fr-FR";recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=3;recognition.onstart=()=>diag("reconnaissance démarrée");recognition.onaudiostart=()=>diag("micro actif");recognition.onspeechstart=()=>diag("parole détectée");recognition.onresult=e=>{diag("résultat reçu");for(let i=e.resultIndex;i<e.results.length;i++){for(let a=0;a<e.results[i].length;a++)handle(e.results[i][a].transcript)}};recognition.onerror=e=>diag("erreur : "+e.error);recognition.onend=()=>{diag("reconnaissance arrêtée");if(listening)setTimeout(()=>{try{recognition.start()}catch(e){diag("relance impossible")}},650)};return true}function toggle(){if(listening){listening=false;try{recognition.stop()}catch(e){}$("listen").textContent="Démarrer l’écoute";setStatus("Pause");disarm();return}if(!setup())return;listening=true;try{recognition.start();$("listen").textContent="Mettre en pause";setStatus("Écoute active");setMode("Dites « Crépouille »")}catch(e){listening=false;diag("erreur démarrage")}}render();
</script></body></html>
