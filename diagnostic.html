<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Crépouille — diagnostic boutons</title><style>html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:28px 20px;text-align:center}h1{font-size:22px}.note{color:#aaa;line-height:1.5}.test{display:block;width:100%;box-sizing:border-box;margin:14px 0;padding:18px;border:1px solid #555;border-radius:16px;background:#181818;color:#fff;font-size:20px}.plus{background:#173d27}.minus{background:#3d1717}#crepe{width:180px;height:180px;border:0;border-radius:50%;font-size:72px;background:#176b35;box-shadow:0 0 0 8px #0c311b;margin:24px auto}#result{margin:22px 0;padding:18px;border-radius:14px;background:#101010;min-height:48px;font-size:18px}#count{font-size:64px;font-weight:700}.ok{color:#9ad59a}.bad{color:#e39a9a}</style></head><body><main><h1>Crépouille — test isolé</h1><p class="note">Cette page ne touche pas aux compteurs de l'application. Elle teste uniquement si les clics JavaScript fonctionnent sur l'iPhone.</p><div id="count">0</div><button id="crepe" type="button">🥞</button><button id="plus" class="test plus" type="button">+ TEST</button><button id="minus" class="test minus" type="button">− TEST</button><button id="voice" class="test" type="button">Tester la voix</button><div id="result">Touchez un bouton.</div><p class="note">Diagnostic : <span id="diag">JavaScript chargé</span></p></main><script>(function(){var n=0,count=document.getElementById('count'),result=document.getElementById('result'),diag=document.getElementById('diag');function show(t){result.textContent=t;result.className='ok'}function change(d){n+=d;count.textContent=n;show('Bouton '+(d>0?'+':'−')+' OK')}document.getElementById('plus').addEventListener('click',function(){change(1)});document.getElementById('minus').addEventListener('click',function(){change(-1)});document.getElementById('crepe').addEventListener('click',function(){show('Bouton crêpe OK')});document.getElementById('voice').addEventListener('click',function(){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('Test Crépouille. La voix fonctionne.');u.lang='fr-FR';speechSynthesis.speak(u);show('Commande vocale lancée')}catch(e){result.textContent='Erreur voix : '+e.message;result.className='bad'}});window.addEventListener('error',function(e){diag.textContent='ERREUR : '+e.message;diag.className='bad'});diag.textContent='OK — événements installés';diag.className='ok'})();</script></body></html>
