<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Crépouille — diagnostic étape 1</title><style>html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:28px 20px;text-align:center}h1{font-size:22px}.note{color:#aaa;line-height:1.5}.test{display:block;width:100%;box-sizing:border-box;margin:14px 0;padding:18px;border:1px solid #555;border-radius:16px;background:#181818;color:#fff;font-size:20px}.plus{background:#173d27}.minus{background:#3d1717}#crepe{width:180px;height:180px;border:0;border-radius:50%;font-size:72px;background:#176b35;box-shadow:0 0 0 8px #0c311b;margin:24px auto}#result,#etaBox{margin:18px 0;padding:18px;border-radius:14px;background:#101010;min-height:48px;font-size:18px}#count{font-size:64px;font-weight:700}#eta{font-size:22px;font-weight:600}#rate{font-size:13px;color:#aaa;margin-top:6px}.ok{color:#9ad59a}.bad{color:#e39a9a}</style></head><body><main><h1>Crépouille — diagnostic étape 1</h1><p class="note">Base boutons fonctionnelle + objectif 1000 + estimation de fin. Cette page ne touche pas aux vrais compteurs.</p><div id="count">0</div><div>crêpes test</div><div id="etaBox"><div id="eta">Estimation en cours…</div><div id="rate">Objectif : 1000</div></div><button id="crepe" type="button">🥞</button><button id="plus" class="test plus" type="button">+ TEST</button><button id="minus" class="test minus" type="button">− TEST</button><button id="voice" class="test" type="button">Tester la voix</button><div id="result">Touchez un bouton.</div><p class="note">Diagnostic : <span id="diag">JavaScript chargé</span></p></main><script>(function(){var n=0,goal=1000,events=[],count=document.getElementById('count'),result=document.getElementById('result'),diag=document.getElementById('diag'),eta=document.getElementById('eta'),rateEl=document.getElementById('rate');function show(t){result.textContent=t;result.className='ok'}function addEvent(){events.push({ts:Date.now(),total:n});if(events.length>100)events=events.slice(-100)}function computeRate(){if(events.length<2)return null;var last=events[events.length-1],first=null;for(var i=0;i<events.length-1;i++){var d=last.total-events[i].total,dt=last.ts-events[i].ts;if(d>=3&&dt>=15000){first=events[i];break}}if(!first)return null;return (last.total-first.total)/((last.ts-first.ts)/1000)}function updateETA(){var remain=Math.max(0,goal-n);if(remain===0){eta.textContent='🎉 Objectif atteint !';rateEl.textContent=n+' / '+goal+' crêpes';return}var r=computeRate();if(!r){eta.textContent='Estimation en cours…';rateEl.textContent='Objectif : '+goal+' · encore '+remain+' · faites au moins 3 + sur 15 s';return}var finish=new Date(Date.now()+(remain/r)*1000),hh=String(finish.getHours()).padStart(2,'0'),mm=String(finish.getMinutes()).padStart(2,'0');eta.textContent='Fin estimée : '+hh+' h '+mm;rateEl.textContent='Objectif : '+goal+' · encore '+remain+' · rythme : '+Math.round(r*3600)+' crêpes/h'}function change(d){n=Math.max(0,n+d);count.textContent=n;addEvent();updateETA();show('Bouton '+(d>0?'+':'−')+' OK')}document.getElementById('plus').addEventListener('click',function(){change(1)});document.getElementById('minus').addEventListener('click',function(){change(-1)});document.getElementById('crepe').addEventListener('click',function(){show('Bouton crêpe OK')});document.getElementById('voice').addEventListener('click',function(){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('Test Crépouille. La voix fonctionne.');u.lang='fr-FR';speechSynthesis.speak(u);show('Commande vocale lancée')}catch(e){result.textContent='Erreur voix : '+e.message;result.className='bad'}});window.addEventListener('error',function(e){diag.textContent='ERREUR : '+e.message;diag.className='bad'});updateETA();diag.textContent='OK — boutons + objectif + estimation chargés';diag.className='ok'})();</script></body></html>
