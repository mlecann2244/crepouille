<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Crépouille tactile</title><style>html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:560px;margin:auto;padding:28px 20px;text-align:center}.note{color:#aaa;line-height:1.5}.crepe{display:block;width:170px;height:170px;margin:24px auto;border:0;border-radius:50%;background:#176b35;color:#fff;font-size:70px;box-shadow:0 0 0 8px #0c311b;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.label{font-size:14px;color:#aaa;margin-top:-14px}.ok{margin:18px 0;padding:18px;background:#111;border-radius:14px;min-height:48px;font-size:18px}</style></head><body><main><h1>Test tactile Crépouille</h1><p class="note">Touchez successivement les 3 crêpes. Le cadre en bas doit indiquer laquelle a été détectée.</p><button id="c1" class="crepe" type="button">🥞</button><div class="label">Test 1 — click</div><button id="c2" class="crepe" type="button">🥞</button><div class="label">Test 2 — pointerup</div><button id="c3" class="crepe" type="button">🥞</button><div class="label">Test 3 — touchend</div><div id="result" class="ok">Aucun toucher détecté.</div></main><script>(function(){var r=document.getElementById('result');function show(t){r.textContent=t+' — OK à '+new Date().toLocaleTimeString('fr-FR')}document.getElementById('c1').addEventListener('click',function(){show('Test 1 : click')});document.getElementById('c2').addEventListener('pointerup',function(e){e.preventDefault();show('Test 2 : pointerup')});document.getElementById('c3').addEventListener('touchend',function(e){e.preventDefault();show('Test 3 : touchend')},{passive:false});window.addEventListener('error',function(e){r.textContent='ERREUR JS : '+e.message})})();</script></body></html>
